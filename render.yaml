services:
  - type: web
    name: magicpin-vera-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: VERA_USE_MISTRAL
        value: "1"
      - key: MISTRAL_MODEL
        value: mistral-large
      - key: MISTRAL_API_KEY
        sync: false
